<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#04050c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>NEON ABYSS — 2189 Ocean Casino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=M+PLUS+1p:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04050c;--bg2:#0a0d1f;--cyan:#29f3ff;--mag:#ff2bd6;--gold:#ffd36b;--gold2:#ff9d2e;--green:#3dffa8;--red:#ff3d6e;
  --txt:#e9f4ff;--dim:#7d8bb3;--glass:rgba(20,30,70,.38);--line:rgba(120,200,255,.22);
  --felt1:#062a3a;--felt2:#021019;--feltline:rgba(41,243,255,.35);
  --accent:var(--cyan);
  --font-d:'Orbitron',system-ui,sans-serif;--font:'M PLUS 1p','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit}
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bgfx .sky{position:absolute;inset:0;background:
  radial-gradient(1200px 600px at 15% -10%,rgba(255,43,214,.20),transparent 60%),
  radial-gradient(900px 600px at 100% 10%,rgba(41,243,255,.18),transparent 60%),
  radial-gradient(800px 500px at 50% 120%,rgba(255,211,107,.10),transparent 60%),
  linear-gradient(180deg,#05061a 0%,#030410 60%,#02030a 100%)}
#bgfx .grid{position:absolute;left:-50%;right:-50%;bottom:-10%;height:55%;transform:perspective(380px) rotateX(62deg);transform-origin:50% 100%;
  background-image:linear-gradient(rgba(41,243,255,.28) 1px,transparent 1px),linear-gradient(90deg,rgba(255,43,214,.22) 1px,transparent 1px);
  background-size:48px 48px;will-change:transform;mask-image:linear-gradient(to top,#000 10%,transparent 90%);-webkit-mask-image:linear-gradient(to top,#000 10%,transparent 90%)}

#bgfx .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);}
#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
/* HUD */
#hud{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(180deg,rgba(8,12,34,.92),rgba(8,12,34,.55));border-bottom:1px solid var(--line);position:relative;z-index:5}
#hud .logo{font-family:var(--font-d);font-weight:900;font-size:13px;letter-spacing:.12em;line-height:1;cursor:pointer;white-space:nowrap}
#hud .logo b{display:block;background:linear-gradient(90deg,var(--cyan),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 6px rgba(41,243,255,.5))}
#hud .logo small{font-size:8px;color:var(--dim);letter-spacing:.3em}
#wallet{margin-left:auto;display:flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;border-radius:999px;background:linear-gradient(180deg,rgba(255,211,107,.16),rgba(255,157,46,.06));border:1px solid rgba(255,211,107,.45);box-shadow:0 0 18px rgba(255,211,107,.15) inset,0 0 12px rgba(255,211,107,.18);position:relative;transition:transform .12s}
#wallet.pulse{animation:wpulse .25s ease-out}
@keyframes wpulse{40%{transform:scale(1.12);box-shadow:0 0 30px rgba(255,211,107,.7),0 0 24px rgba(255,211,107,.5) inset}}
#wallet.down{animation:wdown .4s}
@keyframes wdown{30%{transform:translateY(2px);border-color:var(--red)}}
#wallet .coinicon{width:24px;height:24px}
#crText{font-family:var(--font-d);font-weight:700;font-size:16px;color:var(--gold);text-shadow:0 0 10px rgba(255,211,107,.6);min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
#crText small{font-size:10px;color:#e8c27a;margin-left:3px}
.navbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.navbtn svg{width:20px;height:20px;stroke:var(--cyan);fill:none;stroke-width:1.8}
.navbtn:active{transform:scale(.92)}
.floatdelta{position:absolute;right:8px;top:100%;font-family:var(--font-d);font-weight:900;font-size:16px;pointer-events:none;animation:fd 1.4s ease-out forwards;white-space:nowrap;z-index:9}
.floatdelta.plus{color:var(--gold);text-shadow:0 0 10px var(--gold2)}
.floatdelta.minus{color:var(--red);text-shadow:0 0 8px rgba(255,61,110,.8)}
@keyframes fd{0%{opacity:0;transform:translateY(-6px) scale(.8)}15%{opacity:1;transform:translateY(4px) scale(1.15)}100%{opacity:0;transform:translateY(34px) scale(1)}}
#view{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}
#fx{position:fixed;inset:0;z-index:50;pointer-events:none;width:100%;height:100%}
/* common */
.wrap{max-width:860px;margin:0 auto;padding:12px}
.h1{font-family:var(--font-d);font-weight:900;letter-spacing:.08em}
.glass{background:rgba(14,20,52,.78);border:1px solid var(--line);border-radius:16px}
.btn{font-family:var(--font);font-weight:800;border:none;border-radius:12px;padding:11px 16px;font-size:14px;cursor:pointer;color:#03111a;background:linear-gradient(180deg,#7ff8ff,#18c8e0);box-shadow:0 0 16px rgba(41,243,255,.45),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .08s,filter .2s;letter-spacing:.04em}
.btn:active{transform:translateY(1px) scale(.97)}
.btn.mag{background:linear-gradient(180deg,#ff8ff0,#e21cbc);color:#fff;box-shadow:0 0 16px rgba(255,43,214,.5),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.gold{background:linear-gradient(180deg,#fff0b8,#ffb53d);color:#2b1600;box-shadow:0 0 18px rgba(255,211,107,.55),inset 0 1px 0 #fff}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.btn.red{background:linear-gradient(180deg,#ff8aa6,#e0204f);color:#fff;box-shadow:0 0 14px rgba(255,61,110,.45)}
.btn:disabled{filter:grayscale(1) brightness(.5);pointer-events:none}
.btn.sm{padding:8px 11px;font-size:12px;border-radius:10px}
.row{display:flex;gap:8px;align-items:center}
.center{text-align:center}
.dim{color:var(--dim)}
.neon-c{color:var(--cyan);text-shadow:0 0 8px rgba(41,243,255,.7)}
.neon-m{color:var(--mag);text-shadow:0 0 8px rgba(255,43,214,.7)}
.neon-g{color:var(--gold);text-shadow:0 0 8px rgba(255,211,107,.7)}
/* lobby */
.hero{position:relative;padding:20px 14px 14px;text-align:center}
.hero .t{font-family:var(--font-d);font-weight:900;font-size:clamp(28px,8vw,48px);letter-spacing:.12em;line-height:1;background:linear-gradient(90deg,#8ff9ff,#fff,#ff8ff0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(41,243,255,.55));animation:flick 6s infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.4}94%{opacity:1}96%{opacity:.6}97%{opacity:1}}
.hero .s{font-size:11px;letter-spacing:.35em;color:var(--dim);margin-top:6px;font-family:var(--font-d)}
.hero .peak{margin-top:10px;font-size:12px;color:var(--dim)}
.floors{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px){.floors{grid-template-columns:1fr 1fr}}
.floor{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);min-height:150px;padding:14px;cursor:default;isolation:isolate}
.floor::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--fbg);opacity:.9}
.floor::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 30%,rgba(2,3,10,.85));}
.floor .fn{font-family:var(--font-d);font-weight:900;font-size:18px;letter-spacing:.08em}
.floor .fs{font-size:11px;color:#c5d3f5;opacity:.85;margin-top:2px}
.floor .lv{position:absolute;right:12px;top:12px;font-family:var(--font-d);font-size:10px;letter-spacing:.2em;padding:3px 8px;border-radius:999px;border:1px solid currentColor}
.floor .games{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.gamebtn{flex:1 1 140px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(5,8,22,.6);border:1px solid rgba(255,255,255,.14);cursor:pointer;text-align:left;transition:transform .1s,border-color .2s}
.gamebtn:hover{border-color:var(--cyan)}
.gamebtn:active{transform:scale(.97)}
.gamebtn .gi{width:34px;height:34px;flex:0 0 auto}
.gamebtn b{display:block;font-size:14px}
.gamebtn small{font-size:10px;color:var(--dim)}
.floor.locked .games{filter:blur(2px) grayscale(1);opacity:.4;pointer-events:none}
.floor .lockov{position:absolute;inset:0;display:grid;place-items:center;z-index:2;text-align:center;background:rgba(2,3,10,.35)}
.floor .lockov .lk{font-family:var(--font-d);font-size:12px;letter-spacing:.15em;color:var(--dim)}
.floor .lockov b{display:block;font-family:var(--font-d);font-size:18px;color:var(--gold);margin-top:4px}
.floor .lockov .bar{width:180px;height:6px;border-radius:9px;background:rgba(255,255,255,.1);margin:8px auto 0;overflow:hidden}
.floor .lockov .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--mag))}
.lobbyfoot{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.lobbyfoot .gamebtn{flex-direction:column;text-align:center;gap:4px;padding:12px 6px}
/* game frame */
.gtop{display:flex;align-items:center;gap:8px;padding:8px 10px 0}
.gtop .title{font-family:var(--font-d);font-weight:700;font-size:14px;letter-spacing:.08em}
.gtop .sub{font-size:10px;color:var(--dim)}
.dealerbar{display:flex;align-items:center;gap:10px;padding:8px 10px}
.dealer-av{width:58px;height:58px;flex:0 0 auto;border-radius:50%;overflow:hidden;border:2px solid var(--accent);box-shadow:0 0 14px var(--accent);background:#060a1c;position:relative}
.dealer-av svg{width:100%;height:100%}
.dealer-av.talk{animation:talk .3s 3}
@keyframes talk{50%{transform:scale(1.05)}}
.bubble{position:relative;flex:1;min-height:40px;padding:8px 12px;border-radius:14px;background:rgba(8,14,40,.75);border:1px solid var(--line);font-size:13px;line-height:1.45}
.bubble::before{content:"";position:absolute;left:-7px;top:16px;border:7px solid transparent;border-right-color:var(--line);border-left:0}
.bubble .nm{font-size:10px;color:var(--accent);font-family:var(--font-d);letter-spacing:.12em;display:block}
.bubble .tx{display:block;min-height:1.4em}
.table{position:relative;margin:6px 10px;border-radius:26px;padding:12px 10px;background:radial-gradient(ellipse at 50% 30%,var(--felt1),var(--felt2));border:2px solid var(--feltline);box-shadow:0 0 30px rgba(0,0,0,.6) inset,0 0 22px color-mix(in srgb,var(--feltline) 60%,transparent);overflow:hidden}
.table::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(255,255,255,.015) 0 2px,transparent 2px 6px),radial-gradient(circle at 50% 0,rgba(255,255,255,.06),transparent 60%)}
.table::after{content:"";position:absolute;left:0;top:0;width:30%;height:100%;will-change:transform;background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);animation:sheen 7s infinite;pointer-events:none}
@keyframes sheen{0%{transform:translateX(-110%)}40%,100%{transform:translateX(450%)}}
.msg{text-align:center;font-weight:800;min-height:24px;font-size:14px;margin:4px 0;letter-spacing:.03em}
.ctrl{position:sticky;bottom:0;padding:8px 10px 10px;background:linear-gradient(0deg,rgba(4,6,18,.98) 60%,rgba(4,6,18,0));z-index:4}
.chipbar{display:flex;gap:6px;justify-content:center;padding:4px 0 8px;overflow-x:auto}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.actions .btn{flex:1 1 0;min-width:76px;max-width:180px}
/* chips */
.chip{--c1:#29f3ff;--c2:#0a6f80;width:44px;height:44px;border-radius:50%;position:relative;flex:0 0 auto;display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(circle at 50% 50%,var(--c2) 0 52%,transparent 53%),repeating-conic-gradient(var(--c1) 0 15deg,#f6fbff 15deg 22deg,var(--c1) 22deg 45deg);
  box-shadow:0 3px 0 rgba(0,0,0,.45),0 0 10px color-mix(in srgb,var(--c1) 70%,transparent),inset 0 0 0 2px rgba(255,255,255,.25);font-family:var(--font-d);font-weight:900;font-size:10px;color:#fff;text-shadow:0 1px 2px #000;transition:transform .12s}
.chip::after{content:"";position:absolute;inset:7px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.55)}
.chip span{position:relative;z-index:1}
.chip.sel{transform:translateY(-6px) scale(1.08);box-shadow:0 8px 14px rgba(0,0,0,.5),0 0 18px var(--c1),0 0 0 2px #fff}
.chip.dis{filter:grayscale(1) brightness(.4);pointer-events:none}
.chip.mini{width:26px;height:26px;font-size:0;box-shadow:0 2px 0 rgba(0,0,0,.5),0 0 6px color-mix(in srgb,var(--c1) 70%,transparent)}
.chip.mini::after{inset:4px;border-width:1px}
.flychip{position:fixed;z-index:60;pointer-events:none;margin:0}
.stack{position:absolute;left:50%;bottom:50%;transform:translate(-50%,50%);pointer-events:none;width:26px;height:26px;z-index:3}
.stack .chip{position:absolute;left:0;transition:none}
.stack .amt{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:2px;font-family:var(--font-d);font-size:9px;font-weight:700;color:#fff;background:rgba(0,0,0,.7);padding:1px 5px;border-radius:6px;white-space:nowrap;border:1px solid rgba(255,211,107,.6)}
.spot{position:relative;border:1.5px solid var(--feltline);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:background .2s,box-shadow .2s;background:rgba(0,0,0,.18)}
.spot:hover{background:rgba(41,243,255,.06)}
.spot.win{animation:spotwin .6s 4;background:rgba(255,211,107,.18)}
@keyframes spotwin{50%{box-shadow:0 0 24px var(--gold),inset 0 0 18px rgba(255,211,107,.5);border-color:var(--gold)}}
.spot .lab{font-family:var(--font-d);font-weight:900;letter-spacing:.06em}
.spot .pay{font-size:10px;color:var(--dim)}
/* cards */
.cards{display:flex;justify-content:center;min-height:84px;gap:0;position:relative}
.card{width:56px;height:80px;position:relative;perspective:600px;flex:0 0 auto;margin-left:-14px}
.card:first-child{margin-left:0}
.card .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.card.flip .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.card .b{transform:rotateY(180deg)}
.card .f{background:var(--cardback);border:1.5px solid rgba(255,255,255,.35);box-shadow:0 4px 10px rgba(0,0,0,.5)}
.card .b{background:linear-gradient(160deg,#f7fbff,#d8e6ff);border:1px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.5),0 0 10px rgba(41,243,255,.25);color:#0b1030;font-family:var(--font-d);font-weight:900}
.card .b.r{color:#e0136e}
.card .b .rk{position:absolute;left:5px;top:3px;font-size:15px;line-height:1}
.card .b .st{position:absolute;left:5px;top:20px;font-size:12px;line-height:1}
.card .b .big{position:absolute;right:4px;bottom:2px;font-size:30px;line-height:1;opacity:.92}
.card .b::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(41,243,255,.18) 45%,rgba(255,43,214,.15) 55%,transparent 70%);mix-blend-mode:multiply}
.card.dim .in{filter:brightness(.45)}
.card.hl .b{box-shadow:0 0 0 2px var(--gold),0 0 16px var(--gold)}
.handval{display:inline-block;font-family:var(--font-d);font-weight:900;font-size:12px;padding:2px 8px;border-radius:8px;background:rgba(0,0,0,.6);border:1px solid var(--line);margin-top:4px}
/* players */
.seats{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 8px}
.seat{flex:1 1 0;min-width:0;max-width:200px;padding:6px;border-radius:12px;background:rgba(6,10,30,.6);border:1px solid var(--line);position:relative;text-align:center}
.seat .av{width:34px;height:34px;border-radius:50%;margin:0 auto;overflow:hidden;border:1.5px solid var(--sc,#29f3ff);box-shadow:0 0 8px var(--sc,#29f3ff)}
.seat .av svg{width:100%;height:100%}
.seat .nm{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.seat .ti{font-size:9px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .mn{font-family:var(--font-d);font-size:10px;color:var(--gold)}
.seat .say{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:4px;background:#fff;color:#111;font-size:11px;font-weight:700;padding:4px 8px;border-radius:10px;white-space:nowrap;z-index:6;animation:sayin .25s ease-out;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.seat .say::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#fff}
@keyframes sayin{from{opacity:0;transform:translate(-50%,6px)}}
.seat.act{border-color:var(--gold);box-shadow:0 0 14px rgba(255,211,107,.5)}
.seat.out{opacity:.4}
.seat .tag{position:absolute;right:4px;top:4px;font-size:8px;font-family:var(--font-d);padding:1px 4px;border-radius:5px;background:var(--gold);color:#000;font-weight:900}
/* modal */
#modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(1,2,8,.72);padding:16px}
#modal.on{display:flex}
#modal .box{width:100%;max-width:440px;max-height:88vh;overflow:auto;border-radius:20px;padding:18px;background:linear-gradient(180deg,rgba(14,20,52,.97),rgba(6,8,24,.97));border:1px solid var(--line);box-shadow:0 0 40px rgba(41,243,255,.18);animation:pop .25s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
#modal h2{margin:0 0 10px;font-family:var(--font-d);font-size:18px;letter-spacing:.08em}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:45;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:rgba(8,14,40,.92);border:1px solid var(--cyan);padding:8px 14px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:0 0 16px rgba(41,243,255,.4);animation:toast 2.6s forwards}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
/* big win banner */
#banner{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;pointer-events:none;flex-direction:column}
#banner.on{display:flex}
#banner .bt{font-family:var(--font-d);font-weight:900;font-size:clamp(40px,13vw,92px);letter-spacing:.06em;line-height:1;background:linear-gradient(180deg,#fff7d1 0%,#ffd36b 40%,#ff8a1f 60%,#ffe9a8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #6b2c00);animation:bannerin .7s cubic-bezier(.2,1.6,.4,1)}
#banner .bt.mega{background:linear-gradient(90deg,#29f3ff,#fff,#ff2bd6,#ffd36b,#29f3ff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;animation:bannerin .7s cubic-bezier(.2,1.6,.4,1);filter:drop-shadow(0 4px 0 #3a0030)}
@keyframes rainbow{to{background-position:300% 0}}
@keyframes bannerin{0%{transform:scale(3) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
#banner .ba{font-family:var(--font-d);font-weight:900;font-size:clamp(26px,8vw,52px);color:#fff;text-shadow:0 3px 0 #6b2c00;margin-top:8px;will-change:contents;font-variant-numeric:tabular-nums}
#banner .rays{position:absolute;width:160vmax;height:160vmax;background:repeating-conic-gradient(rgba(255,211,107,.16) 0 8deg,transparent 8deg 20deg);animation:spinr 8s linear infinite;mask-image:radial-gradient(circle,#000 0,transparent 55%);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 55%);z-index:-1}
@keyframes spinr{to{transform:rotate(360deg)}}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.flash{position:fixed;inset:0;z-index:56;pointer-events:none;background:#fff;animation:flash .5s forwards}
@keyframes flash{from{opacity:.8}to{opacity:0}}
/* slots */
.slotcab{position:relative;margin:6px auto;max-width:520px;padding:12px 10px 14px;border-radius:24px;background:linear-gradient(180deg,#1b0d35,#090418);border:2px solid var(--mag);box-shadow:0 0 30px rgba(255,43,214,.35),inset 0 0 30px rgba(255,43,214,.15)}
.slotcab .marquee{text-align:center;font-family:var(--font-d);font-weight:900;font-size:18px;letter-spacing:.2em;margin-bottom:8px}
.slotcab .marquee span{display:inline-block;animation:marq 1.2s infinite alternate}
@keyframes marq{to{opacity:.6}}
.lights{display:flex;justify-content:space-between;padding:0 6px;margin-bottom:6px}
.lights i{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:blink 1s infinite}
.lights i:nth-child(2n){animation-delay:.5s;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
@keyframes blink{50%{opacity:.25}}
.reels{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:6px;border-radius:14px;background:#020108;border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 0 22px #000}
.reel{position:relative;height:calc(var(--cell)*3);overflow:hidden;border-radius:8px;background:linear-gradient(180deg,#0e0a22,#1a1240 50%,#0e0a22)}
.reel::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent 25%,transparent 75%,rgba(0,0,0,.7));pointer-events:none}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.strip.blur{filter:blur(2px) brightness(1.2)}
.sym{height:var(--cell);display:grid;place-items:center;position:relative}
.sym svg{width:78%;height:78%;overflow:visible}
.sym.hit{animation:symhit .5s 4}
@keyframes symhit{50%{transform:scale(1.18);filter:brightness(1.8) drop-shadow(0 0 8px #fff)}}
.payline{position:absolute;inset:6px;pointer-events:none;z-index:3}
.slotinfo{display:flex;justify-content:space-between;margin-top:8px;font-family:var(--font-d);font-size:11px}
.slotinfo div{flex:1;text-align:center;padding:6px;border-radius:10px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.1);margin:0 3px}
.slotinfo b{display:block;font-size:15px;color:var(--gold)}
.freebadge{position:absolute;left:50%;top:-12px;transform:translateX(-50%);background:linear-gradient(90deg,var(--mag),var(--cyan));padding:3px 12px;border-radius:999px;font-family:var(--font-d);font-size:11px;font-weight:900;box-shadow:0 0 14px var(--mag);white-space:nowrap}
/* roulette */
.wheelbox{position:relative;display:flex;justify-content:center;margin:2px 0 6px}
.wheelbox canvas{width:min(78vw,300px);height:min(78vw,300px)}
.wres{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--font-d);font-weight:900;font-size:30px;pointer-events:none;opacity:0;transition:opacity .3s;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:rgba(4,6,20,.88);border:2px solid currentColor;box-shadow:0 0 20px currentColor}
.wres.on{opacity:1;animation:pop .4s}
.history{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:4px 0}
.history i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-d);font-size:10px;font-weight:700;border:1px solid rgba(255,255,255,.3)}
.rb{display:grid;grid-template-columns:1.1fr repeat(12,1fr) 1.1fr;gap:2px;font-family:var(--font-d)}
.rb .spot{border-radius:5px;min-height:34px;font-size:11px;font-weight:700;border-width:1px}
.rb .spot.red{background:rgba(255,40,90,.45)}
.rb .spot.blk{background:rgba(10,12,25,.85)}
.rb .spot.grn{background:rgba(20,200,120,.4)}
.rb .stack{transform:translate(-50%,50%) scale(.75)}
.rb .stack .amt{font-size:10px}
.rb .spot.hot{box-shadow:0 0 0 2px var(--gold),0 0 16px var(--gold);z-index:2}
.cpumark{position:absolute;width:12px;height:12px;border-radius:50%;border:1.5px solid #fff;z-index:4;pointer-events:none;box-shadow:0 0 6px currentColor}
/* dice */
.dome{position:relative;width:min(80vw,280px);height:150px;margin:4px auto;border-radius:140px 140px 24px 24px;background:radial-gradient(ellipse at 50% 30%,rgba(41,243,255,.14),rgba(255,43,214,.06) 60%,transparent 70%),radial-gradient(ellipse at 50% 100%,rgba(0,0,0,.5),transparent);border:1.5px solid rgba(41,243,255,.5);box-shadow:inset 0 0 30px rgba(41,243,255,.2),0 0 22px rgba(41,243,255,.2);display:flex;align-items:flex-end;justify-content:center;gap:16px;padding-bottom:26px;perspective:600px}
.dome::before{content:"";position:absolute;left:12%;top:10%;width:30%;height:20%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent);transform:rotate(-20deg)}
.dome.shake{animation:domeshake .12s 8}
@keyframes domeshake{50%{transform:translate(3px,-3px) rotate(1deg)}}
.die{width:44px;height:44px;position:relative;transform-style:preserve-3d;transition:transform 1.3s cubic-bezier(.2,.9,.3,1.05)}
.die .fc{position:absolute;inset:0;border-radius:9px;background:linear-gradient(145deg,#ffffff,#d6e2ff);border:1px solid #fff;box-shadow:inset 0 0 8px rgba(0,0,40,.25);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:5px}
.die .fc i{width:8px;height:8px;border-radius:50%;background:#101530;margin:auto;opacity:0}
.die .fc i.on{opacity:1}
.die .fc.one i.on,.die .fc.four i.on{background:#e0136e;box-shadow:0 0 4px #ff2bd6}
.die .f1{transform:translateZ(22px)}.die .f6{transform:rotateY(180deg) translateZ(22px)}.die .f2{transform:rotateY(90deg) translateZ(22px)}.die .f5{transform:rotateY(-90deg) translateZ(22px)}.die .f3{transform:rotateX(90deg) translateZ(22px)}.die .f4{transform:rotateX(-90deg) translateZ(22px)}
.sbboard{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.sbboard .spot{min-height:46px;font-size:12px}
.sbboard .spot.big2{grid-column:span 2;min-height:60px}
.sbboard .spot .lab{font-size:15px}
.sbtotal .lab{font-size:13px!important}
/* baccarat */
.bacrow{display:flex;justify-content:space-around;align-items:flex-start;gap:6px}
.bacside{flex:1;text-align:center}
.bacside .lbl{font-family:var(--font-d);font-weight:900;letter-spacing:.15em;font-size:13px;margin-bottom:6px}
.bacspots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.bacspots .spot{min-height:74px}
.bacspots .spot .lab{font-size:15px}
.road{display:grid;grid-auto-flow:column;grid-template-rows:repeat(6,14px);grid-auto-columns:14px;gap:3px;padding:8px;border-radius:12px;background:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px) 0 0/17px 17px,linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px) 0 0/17px 17px,rgba(4,6,20,.8);border:1px solid rgba(255,90,90,.35);overflow-x:auto;margin:6px 10px;justify-content:start;min-height:112px}
.road i{box-shadow:0 0 6px currentColor}
.roadlbl{font-family:var(--font-d);font-size:9px;letter-spacing:.2em;color:var(--dim);margin:6px 12px -2px}
.road i{width:14px;height:14px;border-radius:50%;display:block;font-style:normal;font-size:8px;line-height:14px;text-align:center;color:#fff;font-weight:900}
/* poker */
.ptable{position:relative;margin:4px 8px 64px;height:440px;border-radius:200px/120px;background:radial-gradient(ellipse at 50% 40%,var(--felt1),var(--felt2) 75%);border:3px solid var(--feltline);box-shadow:0 0 0 8px rgba(20,14,40,.9),0 0 0 9px rgba(255,211,107,.35),0 0 40px rgba(41,243,255,.2),inset 0 0 40px rgba(0,0,0,.7)}
.ptable .board{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);display:flex;gap:4px}
.ptable .board .card{margin-left:0;width:44px;height:64px}
.ptable .board .card .b .rk{font-size:13px}.ptable .board .card .b .big{font-size:22px}
.ptable .pot{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:var(--font-d);font-weight:900;font-size:13px;color:var(--gold);text-align:center;text-shadow:0 0 8px rgba(255,211,107,.6);white-space:nowrap}
.ptable .pot .stack{position:relative;left:auto;bottom:auto;transform:none;margin:0 auto 4px}
.pseat{position:absolute;width:92px;text-align:center;transform:translate(-50%,-50%)}
.pseat .box{padding:4px;border-radius:12px;background:rgba(4,6,20,.85);border:1px solid var(--line);position:relative}
.pseat.act .box{border-color:var(--gold);box-shadow:0 0 16px rgba(255,211,107,.6)}
.pseat.fold{opacity:.4}
.pseat .av{width:30px;height:30px;border-radius:50%;margin:0 auto;overflow:hidden;border:1.5px solid var(--sc,#29f3ff)}
.pseat .av svg{width:100%;height:100%}
.pseat .nm{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pseat .st{font-family:var(--font-d);font-size:10px;color:var(--gold)}
.pseat .hc{display:flex;justify-content:center;margin-top:2px;height:46px}
.pseat .hc .card{width:32px;height:46px;margin-left:-8px}
.pseat .hc .card:first-child{margin-left:0}
.pseat .hc .card .b .rk{font-size:11px;left:3px;top:2px}.pseat .hc .card .b .st{font-size:9px;left:3px;top:14px}.pseat .hc .card .b .big{font-size:16px}
.pseat .bet{position:absolute;font-family:var(--font-d);font-size:10px;font-weight:700;color:#fff;background:rgba(0,0,0,.65);border:1px solid var(--gold);border-radius:8px;padding:1px 6px;white-space:nowrap;display:flex;align-items:center;gap:3px}
.pseat .bet:empty{display:none}
.pseat .act-tag{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:10px;font-weight:900;padding:1px 7px;border-radius:7px;background:var(--cyan);color:#001;white-space:nowrap;z-index:3;animation:sayin .2s}
.pseat .btnD{position:absolute;right:-6px;top:-6px;width:18px;height:18px;border-radius:50%;background:#fff;color:#000;font-size:10px;font-weight:900;display:grid;place-items:center;font-family:var(--font-d);box-shadow:0 0 6px #fff}
.pseat .hn{font-size:9px;color:var(--gold);font-weight:800;min-height:12px}
.pseat.me{width:150px}
.pseat.me .hc{height:66px}
.pseat.me .hc .card{width:46px;height:66px}
.pseat.me .hc .card .b .rk{font-size:14px}.pseat.me .hc .card .b .st{font-size:11px;top:18px}.pseat.me .hc .card .b .big{font-size:24px}
.raisebox{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.raisebox input{flex:1;accent-color:var(--gold)}
.raisebox b{font-family:var(--font-d);min-width:80px;text-align:right;color:var(--gold)}
/* gacha */
.gmachine{position:relative;width:240px;height:300px;margin:10px auto}
.gmachine .dome2{position:absolute;left:20px;top:0;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.25),rgba(41,243,255,.08) 40%,rgba(255,43,214,.08) 70%);border:2px solid rgba(41,243,255,.6);box-shadow:0 0 30px rgba(41,243,255,.3),inset 0 0 40px rgba(255,43,214,.2);overflow:hidden}
.gmachine .base{position:absolute;left:30px;top:170px;width:180px;height:120px;border-radius:14px 14px 22px 22px;background:linear-gradient(180deg,#22104a,#0a0420);border:2px solid var(--mag);box-shadow:0 0 22px rgba(255,43,214,.4)}
.gmachine .slot{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:70px;height:40px;border-radius:10px;background:#000;border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 0 12px var(--cyan)}
.gmachine .knob{position:absolute;left:50%;top:22px;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--gold),var(--gold2),var(--gold));box-shadow:0 0 12px var(--gold);transition:transform .8s}
.gmachine .knob::after{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:8px;transform:translateX(-50%);background:#3a1a00;border-radius:4px}
.gmachine.spin .knob{transform:translateX(-50%) rotate(720deg)}
.gmachine.spin .dome2{animation:domeshake .1s 10}
.capsule{position:absolute;width:36px;height:36px;border-radius:50%;box-shadow:inset -4px -6px 10px rgba(0,0,0,.4),inset 4px 4px 8px rgba(255,255,255,.5)}
.capsule::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(0,0,0,.35)}
.reveal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.item{min-width:0}
.reveal.one{grid-template-columns:1fr;max-width:200px;margin:0 auto}
.item{position:relative;border-radius:12px;padding:6px;text-align:center;background:rgba(5,8,22,.7);border:1.5px solid var(--rc);box-shadow:0 0 12px color-mix(in srgb,var(--rc) 60%,transparent);font-size:10px;opacity:0;transform:scale(.5) rotateY(90deg);transition:all .45s cubic-bezier(.3,1.5,.5,1)}
.item.show{opacity:1;transform:none}
.item .pv{height:54px;border-radius:8px;margin-bottom:4px;display:grid;place-items:center;overflow:hidden}
.item .rr{font-family:var(--font-d);font-weight:900;font-size:12px;color:var(--rc);text-shadow:0 0 8px var(--rc)}
.item .nmi{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .dup{position:absolute;right:3px;top:3px;font-size:8px;background:#000;padding:1px 4px;border-radius:5px;color:var(--gold)}
.item.ur{animation:urglow 1.2s infinite}
@keyframes urglow{50%{box-shadow:0 0 26px var(--rc),0 0 50px rgba(255,43,214,.6)}}
.rates{font-size:11px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:10px 0}
.rates div{padding:6px;border-radius:10px;background:rgba(0,0,0,.4);border:1px solid var(--rc)}
.rates b{display:block;font-family:var(--font-d);color:var(--rc)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tabs button{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--cyan);color:#001;border-color:var(--cyan)}
.colgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.colgrid .item{opacity:1;transform:none;cursor:pointer}
.colgrid .item.lock{filter:grayscale(1) brightness(.35)}
.colgrid .item.eq::before{content:"装備中";position:absolute;left:4px;top:4px;font-size:8px;background:var(--cyan);color:#001;padding:1px 5px;border-radius:5px;font-weight:900;z-index:2}
.stat{width:100%;border-collapse:collapse;font-size:13px}
.stat td,.stat th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
.stat td:first-child,.stat th:first-child{text-align:left}
.stat th{font-size:10px;color:var(--dim);font-weight:700}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kv div{padding:10px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.kv small{display:block;font-size:10px;color:var(--dim)}
.kv b{font-family:var(--font-d);font-size:16px;color:var(--gold)}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sw{width:50px;height:28px;border-radius:999px;background:#333a55;position:relative;cursor:pointer;transition:background .2s;border:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--cyan)}.sw.on::after{left:25px}
.avring{border-radius:50%}
.bacspots .spot>.stack,.sbboard .spot>.stack{left:auto;right:5px;bottom:15px;transform:scale(.85)}
.cpuhand .card{width:36px;height:52px;margin-left:-22px}.cpuhand .card .b .rk{font-size:11px;left:3px;top:2px}.cpuhand .card .b .st{font-size:9px;left:3px;top:14px}.cpuhand .card .b .big{font-size:16px}.cpuhand{min-height:54px}

/* ===== v2 bold FX ===== */
#stampLayer{position:fixed;inset:0;z-index:58;pointer-events:none;display:flex;align-items:center;justify-content:center;padding-bottom:10vh}
.stamp{position:absolute;text-align:center;will-change:transform;isolation:isolate}
.stamp::before{content:"";position:absolute;inset:-45% -35%;background:radial-gradient(ellipse at center,rgba(2,3,12,.72),transparent 66%);z-index:-1}
.st-main{font-family:var(--font-d);font-weight:900;letter-spacing:.04em;line-height:.95;white-space:nowrap;background:linear-gradient(180deg,#fff 0%,var(--c) 45%,var(--c2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 rgba(0,0,0,.7))}
.st-sub{font-family:var(--font-d);font-weight:900;font-size:clamp(20px,7vw,40px);color:#fff;text-shadow:0 0 14px var(--c),0 3px 0 #000;margin-top:6px}
.cflash{position:fixed;inset:0;z-index:57;pointer-events:none}
.wipe{position:fixed;left:0;right:0;top:0;height:100%;z-index:59;pointer-events:none;background:linear-gradient(180deg,transparent 0%,rgba(41,243,255,.0) 35%,rgba(41,243,255,.55) 48%,#fff 50%,rgba(255,43,214,.55) 52%,transparent 65%)}
#boot{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#03040c;gap:14px}
#boot .t{font-family:var(--font-d);font-weight:900;font-size:30px;letter-spacing:.14em;background:linear-gradient(90deg,var(--cyan),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent}
#boot .ld{width:180px;height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
#boot .ld i{display:block;width:40%;height:100%;background:linear-gradient(90deg,var(--cyan),var(--mag));animation:ld 1s infinite ease-in-out}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
#cloudDot{width:9px;height:9px;border-radius:50%;position:absolute;right:-2px;top:-2px;background:#7d8bb3;border:1.5px solid #03040c}
#cloudDot[data-s="local"]{background:var(--gold);box-shadow:0 0 8px var(--gold)}
#cloudDot[data-s="on"]{background:var(--green);box-shadow:0 0 8px var(--green)}
#cloudDot[data-s="saving"]{background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:blink .5s infinite}
#cloudDot[data-s="off"],#cloudDot[data-s="err"],#cloudDot[data-s="ro"]{background:var(--red)}
.wheelbox canvas{transition:transform .9s cubic-bezier(.2,.9,.3,1),filter .5s}
.wheelbox.zoom canvas{transform:scale(1.28);filter:drop-shadow(0 0 28px rgba(41,243,255,.55))}
.wheelbox.zoom::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:-1;pointer-events:none}
.wheelbox{z-index:5}
.dwrap{display:inline-block}
.sym.hit{animation:symhit2 .55s 4}
@keyframes symhit2{0%,100%{transform:scale(1)}50%{transform:scale(1.4) rotate(-6deg);filter:brightness(2) drop-shadow(0 0 12px #fff)}}
.reel.stopflash::before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,transparent,rgba(255,255,255,.55),transparent);animation:sflash .35s forwards;pointer-events:none}
@keyframes sflash{from{opacity:1}to{opacity:0}}
.spot.win{animation:spotwin2 .5s 5}
@keyframes spotwin2{50%{box-shadow:0 0 34px var(--gold),inset 0 0 26px rgba(255,211,107,.7);border-color:#fff;transform:scale(1.06)}}

/* ===== v3 MAX ===== */
#bgfx .grid::after{content:none}
#bgfx .gridin{position:absolute;inset:-48px 0 0 0;background-image:inherit;background-size:48px 48px;animation:gridmv 1.6s linear infinite;will-change:transform}
@keyframes gridmv{to{transform:translateY(48px)}}
#app{will-change:transform}
#view{will-change:transform}
.st-wrap{position:relative}
.st-main{position:relative;font-size:inherit}
.st-ch{position:absolute;inset:0;font-family:var(--font-d);font-weight:900;letter-spacing:.04em;line-height:.95;white-space:nowrap;opacity:.7;will-change:transform}
.st-ch.a{color:#ff1f6e;animation:chA .14s steps(2) infinite}
.st-ch.b{color:#1ff4ff;animation:chB .14s steps(2) infinite}
@keyframes chA{0%{transform:translate(-7px,2px)}100%{transform:translate(5px,-1px)}}
@keyframes chB{0%{transform:translate(7px,-2px)}100%{transform:translate(-5px,1px)}}

function cpuAdj(id,n){S.cpus[id]=Math.max(0,cpuBank(id)+n)}

/* ================= chips & betting ================= */
const DENOMS=[100,500,1000,5000,25000,100000];
function chipEl(v,cls=''){const i=DENOMS.indexOf(v);const cols=chipColors();const c1=cols[i<0?0:i];const p=ITEM[S.equip.chip].pal;const e=h(`<div class="chip ${cls}" data-v="${v}"><span>${fmtK(v)}</span></div>`);e.style.setProperty('--c1',c1);e.style.setProperty('--c2',shade(c1,-.55));if(p.holo)e.style.backgroundBlendMode='normal';return e}
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;r=Math.round(r*(1+p));g=Math.round(g*(1+p));b=Math.round(b*(1+p));return '#'+[r,g,b].map(v=>clamp(v,0,255).toString(16).padStart(2,'0')).join('')}
function breakChips(n){const out=[];for(let i=DENOMS.length-1;i>=0;i--){while(n>=DENOMS[i]&&out.length<8){out.push(DENOMS[i]);n-=DENOMS[i]}}return out.reverse()}
function renderStack(spot,amt){if(!spot)return;let st=spot.querySelector(':scope>.stack');if(!amt){st&&st.remove();return}if(!st){st=h('<div class="stack"></div>');spot.appendChild(st)}st.innerHTML='';const ch=breakChips(amt);ch.forEach((v,i)=>{const c=chipEl(v,'mini');c.style.bottom=(i*3)+'px';st.appendChild(c)});st.appendChild(h(`<div class="amt">${fmtK(amt)}</div>`))}
function chipBarHTML(min=100){return `<div class="chipbar" id="chipbar"></div>`}
function setupChipBar(state,min=100){const bar=$('#chipbar');if(!bar)return;bar.innerHTML='';const avail=DENOMS.filter(v=>v>=min);if(!avail.includes(state.chip))state.chip=avail[0];
  avail.forEach(v=>{const c=chipEl(v);if(v===state.chip)c.classList.add('sel');c.onclick=()=>{state.chip=v;$$('.chip',bar).forEach(x=>x.classList.toggle('sel',+x.dataset.v===v));AU.chip()};bar.appendChild(c)});refreshChipBar()}
function refreshChipBar(){$$('#chipbar .chip').forEach(c=>c.classList.toggle('dis',+c.dataset.v>S.cr))}
/* generic bet place on a spot */
async function placeBet(state,key,spot){const v=state.chip;if(S.cr<v){toast('NOAが足りません');return false}spend(v);state.bets[key]=(state.bets[key]||0)+v;const src=$('#chipbar .chip.sel')||$('#wallet');flyChip(v,src,spot).then(()=>renderStack(spot,state.bets[key]));refreshChipBar();return true}
function clearBets(state,spotFor){let t=0;for(const k in state.bets){t+=state.bets[k];const sp=spotFor(k);sp&&renderStack(sp,0)}state.bets={};refund(t);refreshChipBar();if(t)AU.chip()}
const totalBets=b=>Object.values(b).reduce((a,c)=>a+c,0);

function sweepLose(spot){if(!spot)return;const st=spot.querySelector(':scope>.stack');if(!st)return;st.animate([{opacity:1,transform:st.style.transform||'translate(-50%,50%)'},{opacity:0,transform:'translate(-50%,-160px) scale(.3)'}],{duration:500,easing:'ease-in'}).onfinish=()=>st.remove()}

/* ---------- escalating big win: BIG → SUPER → MEGA → JACKPOT, exact final amount ---------- */
async function bigWin(amount,bet){const b=$('#banner'),t=$('#bannerT'),a=$('#bannerA');const ratio=amount/Math.max(1,bet);
  const tiers=[[0,'BIG WIN',false,'#ffd36b'],[12,'SUPER WIN',false,'#ffb020'],[25,'MEGA WIN',true,'#ff2bd6'],[50,'JACKPOT',true,'#29f3ff']].filter(x=>x[0]<=ratio);
  b.classList.add('on');let tier=-1;const setTier=i=>{tier=i;const [,name,mega,col]=tiers[i];t.textContent=name;t.className='bt'+(mega?' mega':'');t.animate([{transform:'scale(2.6) rotate(-6deg)',opacity:0},{transform:'scale(.9)',opacity:1,offset:.5},{transform:'scale(1)'}],{duration:520,easing:'cubic-bezier(.2,1.5,.4,1)'});
    AU.big();AU.slam(.8);flashColor(col,.8);shakeApp(1.5+i*.6);const cx=innerWidth/2,cy=innerHeight/2;FX.ring(cx,cy,{col,max:Math.max(innerWidth,innerHeight),w:18});FX.ring(cx,cy,{col:'#fff',max:Math.max(innerWidth,innerHeight)*.6,w:8,delay:.1});FX.shaft(cx,cy,{col,n:16+i*4,life:2.2});FX.fountain(30+i*25);if(i>=2)FX.confetti(90)};
  setTier(0);FX.rain(60,{dur:2});
  // count up in segments so each tier gets its own moment: 0→BIG→SUPER→MEGA→JACKPOT→exact amount
  const marks=tiers.slice(1).map(x=>x[0]*bet).concat([amount]);const SEG=1250;const total=marks.length*SEG;const st=performance.now();let skip=false;b.style.pointerEvents='auto';b.onclick=()=>{skip=true};
  await new Promise(res=>{const f=t2=>{const el=skip?total:Math.min(total,t2-st);const si=Math.min(marks.length-1,Math.floor(el/SEG));const lp=si===marks.length-1&&el>=total?1:(el-si*SEG)/SEG;const from=si===0?0:marks[si-1];const e=1-Math.pow(1-lp,3);const cur=from+(marks[si]-from)*e;a.textContent='+'+fmt(cur)+' NOA';
      const r=cur/Math.max(1,bet);for(let i=tiers.length-1;i>tier;i--){if(r>=tiers[i][0]-1e-9){setTier(i);break}}
      if(Math.random()<.35)AU.coin(1.2);if(Math.random()<.08)FX.fountain(3);if(el<total)requestAnimationFrame(f);else res()};requestAnimationFrame(f)});
  a.textContent='+'+fmt(amount)+' NOA';a.animate([{transform:'scale(1.5)'},{transform:'scale(1)'}],{duration:400,easing:'cubic-bezier(.2,1.6,.4,1)'});AU.slam(1.2);
  await sleep(skip?500:1300);b.classList.remove('on');b.style.pointerEvents='';b.onclick=null}

    const k=need+nOpp*2;for(let i=0;i<k;i++){const j=i+Math.floor(Math.random()*(deck.length-i));[deck[i],deck[j]]=[deck[j],deck[i]]}

const unlockedGames=()=>FLOORS.filter(f=>S.unlocked.includes(f.id)).flatMap(f=>f.games);

const MIS={
  gen(){const gs=unlockedGames();const r=Math.random();let m;
    const sp=SPECIALS.filter(s=>!s.g||gs.includes(s.g));
    if(r<.28){const g=pick(gs);m={k:'play',g,n:ri(3,6),base:1200}}
    else if(r<.52){const g=pick(gs);m={k:'win',g,n:ri(2,4),base:2500}}
    else if(r<.64){m={k:'net',n:pick([3000,5000,8000])*mScale(),base:3000}}
    else if(r<.76){m={k:'big',n:pick([2000,3000,5000])*mScale(),base:4000}}
    else{const s=pick(sp);m={k:'ev',ev:s.id,min:s.min,max:s.max,set:s.set,txt:s.text,n:s.n||1,base:s.base,g:s.g}}
    m.prog=0;m.id=Math.random().toString(36).slice(2,8);return m},
  text(m){if(m.k==='play')return `${GAMES[m.g].name}を${m.n}回遊ぶ`;if(m.k==='win')return `${GAMES[m.g].name}で${m.n}回勝つ`;if(m.k==='net')return `合計 ${fmt(m.n)} NOA 勝つ`;if(m.k==='big')return `1回で ${fmt(m.n)} NOA 以上勝つ`;return m.txt},
  reward(m){return Math.round(m.base*mScale()*chainMult()/100)*100},
  ensure(){S.mis=(S.mis||[]).filter(m=>m.k!=='play'&&m.k!=='win'||GAMES[m.g]);while(S.mis.length<3)S.mis.push(this.gen())},
  bump(m,by=1){m.prog=Math.min(m.n,m.prog+by);if(m.prog>=m.n)this.complete(m)},
  complete(m){const rw=this.reward(m);S.chain=(S.chain||0)+1;S.mis=S.mis.filter(x=>x!==m);S.mis.push(this.gen());save();
    setTimeout(()=>{stamp('MISSION CLEAR',{col:'#3dffa8',sub:`+${fmt(rw)} NOA　連続${S.chain}`,size:.75,shake:1.2});award(rw,null);toast(`🎯 ${this.text(m)} 達成！（連続ボーナス ×${chainMult().toFixed(2)}）`);renderMisPanel()},900)},
  onRecord(game,bet,ret){this.ensure();const net=ret-bet;[...S.mis].forEach(m=>{if(m.prog>=m.n)return;
    if(m.k==='play'&&m.g===game&&bet>0)this.bump(m);
    else if(m.k==='win'&&m.g===game&&net>0)this.bump(m);
    else if(m.k==='net'&&net>0){m.prog=Math.min(m.n,m.prog+net);if(m.prog>=m.n)this.complete(m)}
    else if(m.k==='big'&&net>=m.n){m.prog=m.n;this.complete(m)}
    else if(m.k==='ev'&&m.ev==='dtwin'&&game==='dragontiger'){if(net>0)this.bump(m);else if(net<0)m.prog=0}});save()},
  onEvent(id,v){if(!S.mis)return;[...S.mis].forEach(m=>{if(m.k!=='ev'||m.ev!==id||m.prog>=m.n)return;if(m.min!=null&&!(v>=m.min))return;if(m.max!=null&&!(v<=m.max))return;if(m.set&&!m.set.includes(v))return;this.bump(m)})},
  reroll(i){const cost=300;if(!spend(cost)){toast('NOAが足りません');return}S.mis[i]=this.gen();save();AU.whoosh();renderMisPanel()}
};

function ccEval(d){const s=[...d].sort((a,b)=>a-b);if(s[0]===s[2])return s[0]===1?{n:'ピンゾロ',str:1000,mult:5,pin:1}:{n:`${s[0]}のゾロ目`,str:900+s[0],mult:3};
  if(s.join('')==='456')return{n:'シゴロ',str:800,mult:2};if(s.join('')==='123')return{n:'ヒフミ',str:-100,mult:2,hifumi:1};
  if(s[0]===s[1])return{n:`${s[2]}の目`,str:s[2],mult:1};if(s[1]===s[2])return{n:`${s[0]}の目`,str:s[0],mult:1};return null}

  else if(g==='blackjack'){t=TH.bj>1?`⚡ CHAIN　<b>次の勝ちは配当 ×${TH.bj}</b>（勝ち続けるとさらに加算）`:'勝つと次の手に倍率がつく（20で勝てば×4、BJなら×8…負けるまで加算）'}
  else if(g==='craps'){t=TH.heat?`🎲 HOT SHOOTER ${TH.heat}連勝　<b>次の勝ちは配当 ×${TH.heat+1}</b>`:'勝ち続けるほど配当 ×2 → ×3 → ×4 … 上限なし'}
  else if(g==='videopoker'){t=TH.vp>1?`✨ <b>次のハンドは配当 ×${TH.vp}</b>`:'役ができると次のハンドに倍率（最大×12）'}
  else if(g==='race'){t=`💰 キャリーオーバー <b>${fmt(S.raceCarry||0)} NOA</b>　3連単的中で総取り`}
  else if(g==='bigsix'){t='当たるたびに倍率ルーレット（最大 ×100）'}
  else if(g==='keno'){t='⭐ 毎回ゴールデンナンバーを抽選。当たれば ×5（2個で ×25）'}
  else if(g==='roulette'||g==='roulette_hi'){t='⚡ 毎スピン、ランダムな数字に最大 ×500 のライトニング'}
  else if(g==='sicbo'){t='⚡ 毎回、ランダムな合計に最大 ×50 倍のライトニング'}
  else if(g==='baccarat'){t='🐉 毎回、賭け枠に最大 ×20 の倍率がつくことがある'}
  else if(g==='hilo'){t='🎁 3・5・7・10連続…で倍率にボーナス。上限なし'}
  else if(g==='poker'){t='🔥 3割の確率で HOT POT（ポットが最大 ×25）'}
  el.innerHTML=t;el.classList.toggle('hot',/次の/.test(t))}

/* ---------- the settle wrapper: apply chains, then offer double-up ---------- */
const _stT=settle;settle=async function(game,bet,ret,fromEl,dealer){let net=ret-bet,mult=1,label='';
  if(net>0){
    if(game==='bigsix'){mult=await rollMult([[1,34],[2,30],[3,16],[5,10],[10,6],[25,3],[100,1]]);label='MULTIPLIER'}
    else if(game==='keno'){const g=$$('#kg .kn.gold.hit').length;mult=[1,5,25][g]||1;label='GOLDEN NUMBER'}
    else if(game==='dragontiger'){mult=FIB[TH.dt];label=`闘気 ${TH.dt}連勝`}
    else if(game==='blackjack'){mult=TH.bj;label='LIGHTNING CHAIN'}
    else if(game==='craps'){mult=TH.heat+1;label='HOT SHOOTER'}
    else if(game==='videopoker'){mult=TH.vp;label='MULTIPLIER'}}
  if(game==='race'){if(TH.tri&&(S.raceCarry||0)>0){const c=S.raceCarry;S.raceCarry=0;ret+=c;achv('carry');await stamp('CARRY OVER!',{col:'#ffd36b',sub:`+${fmt(c)} NOA 総取り！`,size:.9,shake:3});lightning(innerWidth/2,innerHeight*.4,3,'#ffd36b')}else if(!TH.tri)S.raceCarry=(S.raceCarry||0)+bet;TH.tri=false}
  if(mult>1&&game!=='bigsix'){await stamp('×'+mult,{col:'#ffe14a',sub:label,size:1,shake:Math.min(3,1+mult/8)})}
  if(mult>1)ret=bet+net*mult;ret=Math.floor(ret);net=ret-bet;
  // next-round state (before the inner settle so the HUD is right when it ends)
  if(game==='dragontiger'){if(net>0)TH.dt++;else if(ret===0)TH.dt=0}
  if(game==='blackjack'){if(net>0){const txt=[...$$('#pH .handval')].map(e=>e.textContent).find(t=>/WIN/.test(t))||'';const mm=txt.match(/^(\d+)(?:\/(\d+))?/);const tot=/BJ/.test(txt)?99:mm?+(mm[2]||mm[1]):18;const add=tot===99?8:tot>=21?6:tot===20?4:tot===19?3:2;TH.bj=(TH.bj>1?TH.bj:0)+add}else if(net<0)TH.bj=1}
  if(game==='craps'){if(net>0)TH.heat++;else if(net<0)TH.heat=0}
  if(game==='videopoker'){const w=$('#vppay tr.win');TH.vp=net>=0&&w?[12,12,10,8,6,5,4,3,2][+w.dataset.i]||1:1}
  if(TH.ltHit){TH.ltHit=false;if(net>0){achv('ltg');lightning(innerWidth/2,innerHeight*.4,3,'#ffe14a')}}
  await _stT(game,bet,ret,fromEl,dealer);
  if(bet>0&&ret/bet>=100)achv('x100');
  if(net>0)legendAdd(game,net,bet?ret/bet:0);
  if(['roulette','roulette_hi','sicbo','baccarat'].includes(game)){TH.spot[game]={};setTimeout(clearLight,2600)}
  thHud();if(net>0&&game!=='poker')DU.offer(net,game)};

    $('#evGive').onclick=()=>{evClose();achv('honest');const r=Math.random();if(r<.5){S.tickets=(S.tickets||0)+3;stamp('お礼',{col:'#3dffa8',sub:'ガチャチケット×3 をもらった',size:.85,shake:1})}else if(r<.85){const g=Math.floor(amt*.5);award(g,null);stamp('お礼',{col:'#3dffa8',sub:`謝礼 +${fmt(g)} NOA`,size:.85,shake:1})}else{const g=amt*3;award(g,null,{big:true});stamp('大富豪の財布だった',{col:'#ffd36b',sub:`謝礼 +${fmt(g)} NOA！`,size:.8,shake:2.5})}save()}}},
  fortune:{w:20,ok:()=>true,run(){const fee=Math.min(S.cr,Math.max(500,Math.round(S.cr*.03/100)*100));
    evModal(`${evAv('misty','#a86bff')}<div class="ev-t" style="color:#a86bff">占い師ミスティ</div><p>路地の奥で、水晶玉がぼんやり光っている。<br>「あなたの運命、視てあげましょうか…？」</p><div style="display:grid;gap:8px"><button class="btn" id="evSee" style="background:linear-gradient(180deg,#c9a6ff,#7a3ad6);color:#fff">占ってもらう（${fmt(fee)} NOA）<br><small style="font-weight:400">大吉・吉・凶のどれかが出る</small></button><button class="btn ghost" id="evSkip">通りすぎる</button></div>`);
    $('#evSkip').onclick=()=>evClose();
    $('#evSee').onclick=async()=>{$$('#evSee,#evSkip').forEach(x=>x.disabled=true);evLose(fee);for(let k=0;k<4;k++){AU.tone(400+k*120,.3,{type:'sine',vol:.08});await sleep(320)}evClose();const r=wpick([['dai',20],['kichi',50],['kyo',30]]);
      if(r==='dai'){S.luck={x:3,n:5};stamp('大吉',{col:'#ffd36b',sub:'これから5ゲーム、勝ち分が3倍！',size:1.2,shake:2.5});FX.confetti(80)}else if(r==='kichi'){S.luck={x:2,n:5};stamp('吉',{col:'#3dffa8',sub:'これから5ゲーム、勝ち分が2倍！',size:1.2,shake:1.5})}else{S.luck={x:.5,n:3};stamp('凶',{col:'#ff3d6e',sub:'これから3ゲーム、勝ち分が半分に…',size:1.2,shake:1.5,ring:false});vignette('rgba(120,60,200,.8)')}save();luckHud()}}},
};
function luckHud(){const el=$('#fever');if(!el)return;const l=S.luck;const base=(S.streak||0)>=3?`🔥 FEVER ${S.streak}連勝　勝ち分+10%`:'';el.innerHTML=base+(l&&l.n>0?`　<span style="color:${l.x>1?'#ffd36b':'#c9a6ff'}">🔮${l.x>1?'運気×'+l.x:'凶'} 残り${l.n}</span>`:'')}
const _uf12=updFever;updFever=function(){_uf12();luckHud()};
function runEvent(id){EV.pending=null;EV.cool=12;S.ev=S.ev||{};EVENTS[id].run()}
function tryEvent(){if(!EV.pending)return;if(window.__noJP){EV.pending=null;return}if($('#modal').classList.contains('on')||$('#banner').classList.contains('on')||document.querySelector('#stampLayer .stamp')||$('.dubtn')||scenePlaying||jpPending||CUR==='duel'||CUR==='dive'||CUR==='cup'||(CUR==='poker'&&(PK.active||PK.inHand))||bankruptOpen||lcOpen){setTimeout(tryEvent,2500);return}
  const id=EV.pending;if(!EVENTS[id].ok()){EV.pending=null;return}runEvent(id)}
const _rec12=record;record=function(game,bet,ret){_rec12(game,bet,ret);if(bet<=0)return;if(EV.cool>0){EV.cool--;return}if(!EV.pending&&Math.random()<.07){const c=Object.entries(EVENTS).filter(([k,e])=>e.ok());if(!c.length)return;EV.pending=wpick(c.map(([k,e])=>[k,e.w]));setTimeout(tryEvent,4200)}};
/* fortune buff on wins */
const _st12=settle;settle=async function(game,bet,ret,fromEl,dealer){const l=S.luck;const on=l&&l.n>0&&bet>0;if(on&&ret>bet)ret=Math.floor(bet+(ret-bet)*l.x);await _st12(game,bet,ret,fromEl,dealer);if(on){if(ret>bet)toast(l.x>1?`🔮 占いの運気で 勝ち分×${l.x}！`:'🔮 凶の影響で 勝ち分が半分に…');l.n--;if(l.n<=0){S.luck=null;toast('🔮 占いの効果が切れた')}save();luckHud()}};
/* ================= GACHA ================= */
function itemPreview(it){if(it.cat==='cardback')return `<div style="width:34px;height:48px;border-radius:5px;background:${it.css};border:1px solid rgba(255,255,255,.4);box-shadow:0 2px 6px #000"></div>`;
  if(it.cat==='chip'){const p=it.pal;const cs=p.chips||DEF_CHIP_COLORS;const c=p.coin;return `<div style="display:flex;align-items:center;gap:3px"><div style="width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,${c[0]},${c[1]} 50%,${c[2]});border:2px solid ${c[3]}"></div><div style="width:24px;height:24px;border-radius:50%;background:radial-gradient(circle,${shade(cs[2],-.5)} 0 50%,transparent 52%),repeating-conic-gradient(${cs[2]} 0 15deg,#fff 15deg 22deg,${cs[2]} 22deg 45deg)"></div></div>`}
  if(it.cat==='table')return `<div style="width:64px;height:40px;border-radius:20px;background:radial-gradient(ellipse at 50% 30%,${it.v[0]},${it.v[1]});border:2px solid ${it.v[2]};box-shadow:0 0 10px ${it.v[2]}"></div>`;
  if(it.cat==='avatar')return `<div style="width:42px;height:42px;border-radius:50%;padding:3px;background:${it.ring||'rgba(255,255,255,.08)'};position:relative"><div style="width:100%;height:100%;border-radius:50%;overflow:hidden">${avatarSVG('player','#ffd36b')}</div>${it.crown?'<svg style="position:absolute;left:50%;top:-8px;transform:translateX(-50%)" width="18" height="12" viewBox="0 0 18 12"><path d="M1 11 L2 3 L6 7 L9 1 L12 7 L16 3 L17 11Z" fill="#ffd36b"/></svg>':''}</div>`;
  if(it.cat==='outfit'){const col=it.col||'#7d8bb3';return `<svg width="46" height="46" viewBox="0 0 60 60"><path d="M8 60 Q10 30 30 28 Q50 30 52 60Z" fill="#0a0e24"/><path d="M8 60 Q10 30 30 28 L25 60Z M52 60 Q50 30 30 28 L35 60Z" fill="${col}"/><path d="M25 30 L30 40 L35 30" fill="#fff"/><path d="M27 37 L30 41 L33 37 L30 46Z" fill="#ff2bd6"/><circle cx="30" cy="16" r="10" fill="#c9d6ff" opacity=".5"/></svg>`}
  return ''}
function itemCard(it,{dup=false,cls=''}={}){const R=RAR[it.r];return `<div class="item ${it.r===3?'ur':''} ${cls}" style="--rc:${R.c}" data-id="${it.id}"><div class="pv" style="background:radial-gradient(circle,${R.c}22,transparent 70%)">${itemPreview(it)}</div><div class="rr">${R.k}</div><div class="nmi">${it.name}</div><div class="dim" style="font-size:8px">${CATS[it.cat]}</div>${dup?`<div class="dup">重複 +${RAR[it.r].dup}</div>`:''}</div>`}
const POOL=ITEMS.filter(i=>!i.base&&!i.excl);
function rollRarity(min=0){let x=Math.random()*100;let r=0;for(let i=0;i<4;i++){if((x-=RAR[i].rate)<0){r=i;break}}return Math.max(r,min)}
function rollItem(min=0){const r=rollRarity(min);const c=POOL.filter(i=>i.r===r);return pick(c)}
function renderGacha(v){v.innerHTML=`<div class="wrap"><div class="gtop" style="padding:0"><button class="navbtn" onclick="go('lobby')"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div><div class="title neon-m">HOLO GACHA</div><div class="sub">見た目が変わるアイテムだけが出ます（勝率には影響しません）</div></div></div>
  <div class="gmachine" id="gm"><div class="dome2" id="gdome"></div><div class="base"><div class="knob"></div><div class="slot"></div></div></div>
  <div class="rates">${RAR.slice(0,4).map(r=>`<div style="--rc:${r.c}"><b>${r.k}</b>${r.rate}%</div>`).join('')}</div>
  <div class="row" style="justify-content:center"><button class="btn mag" id="g1">1回 1,000NOA</button><button class="btn gold" id="g10">10連 10,000NOA<br><small style="font-weight:400">SR以上1つ確定</small></button></div><div class="row" style="justify-content:center;margin-top:8px"><button class="btn" id="gT" ${(S.tickets||0)?'':'disabled'}>${ticketLabel()}</button><button class="btn ghost" id="gT10" ${(S.tickets||0)>=10?'':'disabled'}>🎟×10で10連</button></div>
  <p class="center dim" style="font-size:10px;margin-top:8px">重複したアイテムはレア度に応じてNOAに変換（N100／R250／SR600／UR2,000）｜所持 ${S.owned.length}/${ITEMS.length}｜累計 ${S.pulls}回</p>
  <div id="gres" style="margin-top:12px"></div>
  <details style="margin-top:12px" class="glass"><summary style="padding:10px;cursor:pointer;font-size:12px">排出アイテム一覧</summary><div class="colgrid" style="padding:10px">${POOL.map(i=>itemCard(i)).join('')}</div></details></div>`;
  $$('details .item').forEach(e=>e.classList.add('show'));
  const dome=$('#gdome');const cols=['#29f3ff','#ff2bd6','#ffd36b','#3dffa8','#a86bff','#ff7a2e'];for(let i=0;i<16;i++){const c=h(`<div class="capsule" style="left:${rnd(10,150)}px;top:${rnd(80,160)}px;background:linear-gradient(180deg,${pick(cols)} 50%,#e9f4ff 50%)"></div>`);dome.appendChild(c)}
  let busy=false;
  async function pull(n,useT=false){if(busy)return;const cost=n===1?1000:10000;if(useT){if((S.tickets||0)<n){toast('チケットが足りません');return}busy=true;S.tickets-=n;const tb=$('#gT');if(tb)tb.innerHTML=ticketLabel()}else{if(S.cr<cost){toast('NOAが足りません');return}busy=true;spend(cost)}S.pulls+=n;
    const res=[];for(let i=0;i<n;i++)res.push(rollItem(n===10&&i===9&&!res.some(x=>x.r>=2)?2:0));
    const top=Math.max(...res.map(x=>x.r));
    const gm=$('#gm');gm.classList.add('spin');AU.whoosh();$$('.capsule',dome).forEach(c=>c.animate([{transform:'none'},{transform:`translate(${rnd(-30,30)}px,${rnd(-60,0)}px) rotate(${rnd(-180,180)}deg)`},{transform:'none'}],{duration:900,easing:'ease-in-out'}));
    await sleep(1000);gm.classList.remove('spin');
    // capsule drop
    const cap=h(`<div class="capsule" style="width:54px;height:54px;left:93px;top:250px;background:linear-gradient(180deg,${RAR[top].c} 50%,#fff 50%);box-shadow:0 0 30px ${RAR[top].c},inset -4px -6px 10px rgba(0,0,0,.4);z-index:3"></div>`);gm.appendChild(cap);
    cap.animate([{transform:'translateY(-40px) scale(.4)',opacity:0},{transform:'translateY(10px) scale(1.1)',opacity:1},{transform:'none'}],{duration:500,easing:'cubic-bezier(.3,1.6,.5,1)'});AU.chip();await sleep(600);
    for(let k=0;k<(top>=2?3:1);k++){cap.animate([{transform:'rotate(-14deg)'},{transform:'rotate(14deg)'},{transform:'none'}],{duration:260});AU.tick();await sleep(300)}
    const r=cap.getBoundingClientRect();FX.sparkle(r.left+27,r.top+27,top>=2?40:16,RAR[top].c);if(top>=3){document.body.appendChild(h('<div class="flash"></div>'));setTimeout(()=>$('.flash')?.remove(),600);FX.confetti(140);$('#app').classList.add('shake');setTimeout(()=>$('#app').classList.remove('shake'),600)}
    AU.gacha(top);cap.animate([{transform:'scale(1)',opacity:1},{transform:'scale(2.2)',opacity:0}],{duration:400,fill:'forwards'});await sleep(400);cap.remove();
    // reveal
    const gr=$('#gres');let dupCR=0;const marks=res.map(it=>{const dup=S.owned.includes(it.id);if(dup)dupCR+=RAR[it.r].dup;else S.owned.push(it.id);return dup});
    gr.innerHTML=`<div class="reveal ${n===1?'one':''}">${res.map((it,i)=>itemCard(it,{dup:marks[i]})).join('')}</div>${dupCR?`<p class="center neon-g" style="font-size:12px">重複ボーナス +${fmt(dupCR)} NOA</p>`:''}<div class="center" style="margin-top:8px"><button class="btn ghost sm" onclick="go('collection')">コレクションで装備する</button></div>`;
    const its=$$('.item',gr);for(let i=0;i<its.length;i++){await sleep(n===1?50:160);its[i].classList.add('show');AU.gacha(res[i].r);if(res[i].r>=2){stamp(RAR[res[i].r].k+' GET!',{col:RAR[res[i].r].c,sub:res[i].name,size:res[i].r===3?1:.75,shake:res[i].r===3?2.5:1.2,dur:res[i].r===3?1500:1000});const b=its[i].getBoundingClientRect();FX.sparkle(b.left+b.width/2,b.top+b.height/2,res[i].r===3?30:14,RAR[res[i].r].c)}}
    if(dupCR){await sleep(300);award(dupCR,gr)}
    if(top>=3)toast('★ URアイテム獲得！ ★');save();busy=false;setTimeout(checkBankrupt,1500);$('.center.dim',v).innerHTML=`重複したアイテムはレア度に応じてNOAに変換（N100／R250／SR600／UR2,000）｜所持 ${S.owned.length}/${ITEMS.length}｜累計 ${S.pulls}回`}
  $('#g1').onclick=()=>pull(1);$('#g10').onclick=()=>pull(10);$('#gT').onclick=()=>pull(1,true);$('#gT10').onclick=()=>pull(10,true)}
function ticketLabel(){return `🎟 チケットで1回（残り${S.tickets||0}枚）`}

/* ================= COLLECTION ================= */
function renderCollection(v,cat='cardback'){v.innerHTML=`<div class="wrap"><div class="gtop" style="padding:0 0 8px"><button class="navbtn" onclick="go('lobby')"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div><div class="title neon-c">COLLECTION</div><div class="sub">所持 ${S.owned.length} / ${ITEMS.length}　タップで装備</div></div></div>
  <div class="tabs">${Object.entries(CATS).map(([k,n])=>`<button class="${k===cat?'on':''}" data-c="${k}">${n} ${ITEMS.filter(i=>i.cat===k&&S.owned.includes(i.id)).length}/${ITEMS.filter(i=>i.cat===k).length}</button>`).join('')}</div>
  <div class="colgrid">${ITEMS.filter(i=>i.cat===cat).sort((a,b)=>a.r-b.r).map(i=>{const own=S.owned.includes(i.id);return itemCard(own?i:{...i,name:'？？？'},{cls:(own?'':'lock')+(S.equip[cat]===i.id?' eq':'')})}).join('')}</div>
  <div class="glass" style="margin-top:14px;padding:12px"><div class="dim" style="font-size:11px;margin-bottom:6px">プレビュー</div><div class="row" style="justify-content:center;gap:14px;flex-wrap:wrap" id="prev"></div></div></div>`;
  $$('.tabs button',v).forEach(b=>b.onclick=()=>renderCollection(v,b.dataset.c));
  $$('.colgrid .item',v).forEach(e=>e.onclick=()=>{const id=e.dataset.id;if(!S.owned.includes(id)){toast('未入手のアイテムです');return}S.equip[cat]=id;save();applyCosmetics();AU.click();FX.sparkle(e.getBoundingClientRect().left+50,e.getBoundingClientRect().top+40,12,RAR[ITEM[id].r].c);renderCollection(v,cat)});
  const pr=$('#prev');const c1={r:0,s:0},c2={r:12,s:1};pr.appendChild(cardEl(c1,false));pr.appendChild(cardEl(c2,true));DENOMS.slice(0,4).forEach(d=>pr.appendChild(chipEl(d)));pr.insertAdjacentHTML('beforeend',`<div style="width:70px;height:44px;border-radius:22px;background:radial-gradient(ellipse at 50% 30%,var(--felt1),var(--felt2));border:2px solid var(--feltline)"></div><div class="dealer-av" style="--accent:#ffd36b">${dealerSVG(DEALERS.zero)}</div>`);
  $$('.card',pr).forEach(c=>c.style.marginLeft='0');
  const r=pr.getBoundingClientRect();if(cat==='chip')setTimeout(()=>FX.burst(r.left+r.width/2,r.top+20,10,{home:false}),200)}

/* ================= STATS ================= */
function renderStats(v){const rows=Object.keys(GAMES).map(k=>{const s=S.stats[k]||{w:0,l:0,p:0,bet:0,net:0,best:0};const n=s.w+s.l+s.p;return `<tr><td>${GAMES[k].name}</td><td>${n}</td><td>${s.w}</td><td>${s.l}</td><td>${n?Math.round(s.w/n*100):0}%</td><td style="color:${s.net>=0?'var(--gold)':'var(--red)'}">${s.net>=0?'+':''}${fmt(s.net)}</td><td>${fmt(s.best)}</td></tr>`}).join('');
  v.innerHTML=`<div class="wrap"><div class="gtop" style="padding:0 0 8px"><button class="navbtn" onclick="go('lobby')"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div><div class="title neon-g">STATS</div><div class="sub">あなたの戦績</div></div></div>
  <div class="kv"><div><small>所持NOA</small><b>${fmt(S.cr)}</b></div><div><small>最高到達額</small><b>${fmt(S.peak)}</b></div><div><small>最高獲得額（1回）</small><b>${fmt(S.best)}</b><small>${S.bestGame?GAMES[S.bestGame].name:'-'}</small></div><div><small>最大連勝数</small><b>${S.maxStreak}</b><small>現在 ${S.streak}連勝</small></div><div><small>ガチャ回数</small><b>${S.pulls}</b></div><div><small>破産回数</small><b>${S.bankrupts}</b></div></div>
  <div class="glass" style="padding:8px;overflow-x:auto"><table class="stat"><tr><th>ゲーム</th><th>回数</th><th>勝</th><th>負</th><th>勝率</th><th>収支</th><th>最高</th></tr>${rows}</table></div>
  <p class="dim center" style="font-size:10px;margin-top:10px">勝ち＝その回の払い戻しが賭け金を上回ったとき</p></div>`}

/* ================= init ================= */
load();BOOT_FRESH=isFresh(S);FX.init();applyCosmetics();WAL.snap();go('lobby');renderRankBadge();setTimeout(()=>{checkRank();checkMisc()},2500);CLOUD.init();setTimeout(hideBoot,6000);
</script></body></html>
